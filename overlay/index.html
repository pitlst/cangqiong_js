<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            background: #10b981;
            color: white;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .status-item {
            text-align: center;
            padding: 16px;
            background: white;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }
        .status-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .status-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }
        .status-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5a67d8; transform: translateY(-1px); }
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        .btn-warning:hover { background: #d97706; }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover { background: #dc2626; }
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .log-info { background: #dbeafe; color: #1e40af; }
        .log-success { background: #d1fae5; color: #065f46; }
        .log-warn { background: #fef3c7; color: #92400e; }
        .log-error { background: #fee2e2; color: #991b1b; }
        .icon { font-size: 16px; font-weight: bold; width: 20px; text-align: center; }
        .footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            [IFRAME]
            <span class="badge">RUNNING</span>
        </h1>
        <p class="subtitle">Running inside iframe, logging to parent console</p>

        <div class="card">
            <div class="card-title">Real-time Status</div>
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-value" id="counter">0</div>
                    <div class="status-label">Clicks</div>
                </div>
                <div class="status-item">
                    <div class="status-value" id="fps">60</div>
                    <div class="status-label">FPS</div>
                </div>
                <div class="status-item">
                    <div class="status-value" id="mem">--</div>
                    <div class="status-label">Memory(MB)</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Console Actions</div>
            <div class="btn-group">
                <button class="btn-primary" onclick="sendLog('info')">Send Info</button>
                <button class="btn-primary" onclick="sendLog('table')">Send Table</button>
                <button class="btn-warning" onclick="sendLog('warn')">Send Warn</button>
                <button class="btn-danger" onclick="sendLog('error')">Send Error</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Recent Logs</div>
            <div id="log-container">
                <div class="log-entry log-info">
                    <span class="icon">i</span>
                    <span>System initialized, waiting for action...</span>
                </div>
            </div>
        </div>

        <div class="footer">
            Origin: <span id="origin"></span> | 
            Size: <span id="size"></span> | 
            UA: <span id="ua"></span>
        </div>
    </div>

    <script>
        const parentConsole = window.parent.console;

        function logToParent(type, ...args) {
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            const prefix = `[Iframe][${timestamp}]`;
            
            switch(type) {
                case 'log':
                    parentConsole.log(`%c${prefix}`, 'color: #667eea; font-weight: bold;', ...args);
                    break;
                case 'warn':
                    parentConsole.warn(`%c${prefix}`, 'color: #f59e0b; font-weight: bold;', ...args);
                    break;
                case 'error':
                    parentConsole.error(`%c${prefix}`, 'color: #ef4444; font-weight: bold;', ...args);
                    break;
                case 'info':
                    parentConsole.info(`%c${prefix}`, 'color: #10b981; font-weight: bold;', ...args);
                    break;
                case 'table':
                    parentConsole.log(`%c${prefix} Table:`, 'color: #667eea; font-weight: bold;');
                    parentConsole.table(...args);
                    break;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            logToParent('info', 'Iframe test app loaded');
            logToParent('log', 'Current URL:', location.href);
            logToParent('log', 'Viewport:', `${window.innerWidth}x${window.innerHeight}`);
            
            const sysInfo = {
                'User Agent': navigator.userAgent.slice(0, 50) + '...',
                'Language': navigator.language,
                'Platform': navigator.platform,
                'Online': navigator.onLine ? 'Yes' : 'No',
                'Cookies': navigator.cookieEnabled ? 'Yes' : 'No',
                'Cores': navigator.hardwareConcurrency || 'Unknown'
            };
            logToParent('table', sysInfo);

            document.getElementById('origin').textContent = location.origin || 'null';
            document.getElementById('size').textContent = `${window.innerWidth}x${window.innerHeight}`;
            document.getElementById('ua').textContent = navigator.userAgent.slice(0, 30) + '...';
        });

        let clickCount = 0;

        function sendLog(type) {
            clickCount++;
            document.getElementById('counter').textContent = clickCount;
            
            const logContainer = document.getElementById('log-container');
            const time = new Date().toLocaleTimeString('zh-CN');
            
            let entryClass, icon, message;

            switch(type) {
                case 'info':
                    logToParent('info', `Button clicked ${clickCount} times`);
                    entryClass = 'log-success';
                    icon = 'OK';
                    message = `Info log sent to parent [${time}]`;
                    break;
                case 'warn':
                    logToParent('warn', 'Warning test', { detail: 'User triggered warning' });
                    entryClass = 'log-warn';
                    icon = '!';
                    message = `Warn log sent to parent [${time}]`;
                    break;
                case 'error':
                    logToParent('error', 'Simulated error:', new Error('Test error'));
                    entryClass = 'log-error';
                    icon = 'X';
                    message = `Error log sent to parent [${time}]`;
                    break;
                case 'table':
                    const data = [
                        { Item: 'Clicks', Value: clickCount, Status: 'OK' },
                        { Item: 'Random', Value: Math.floor(Math.random() * 100), Status: 'Random' },
                        { Item: 'Timestamp', Value: Date.now(), Status: 'Live' }
                    ];
                    logToParent('table', data);
                    entryClass = 'log-info';
                    icon = '#';
                    message = `Table log sent to parent [${time}]`;
                    break;
            }

            const entry = document.createElement('div');
            entry.className = `log-entry ${entryClass}`;
            entry.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
            logContainer.insertBefore(entry, logContainer.firstChild);
            
            while (logContainer.children.length > 5) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        let lastTime = performance.now();
        let frames = 0;
        
        function updateStats() {
            frames++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = frames;
                frames = 0;
                lastTime = now;
                
                if (performance.memory) {
                    const used = Math.round(performance.memory.usedJSHeapSize / 1048576);
                    document.getElementById('mem').textContent = used;
                }
            }
            requestAnimationFrame(updateStats);
        }
        updateStats();

        window.addEventListener('message', (e) => {
            logToParent('info', 'Message from parent:', e.data);
            
            const entry = document.createElement('div');
            entry.className = 'log-entry log-info';
            entry.innerHTML = `<span class="icon">&lt;</span><span>From parent: ${JSON.stringify(e.data).slice(0, 50)}</span>`;
            const container = document.getElementById('log-container');
            container.insertBefore(entry, container.firstChild);
        });

        if (window.parent !== window) {
            window.parent.postMessage({ type: 'IFRAME_READY', timestamp: Date.now() }, '*');
            logToParent('log', 'Ready notification sent to parent (postMessage)');
        }
    </script>
</body>
</html>
