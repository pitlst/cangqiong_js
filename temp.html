<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>列表编辑页面</title>
    <style>
        :root {
            --background: oklch(1 0 0);
            --foreground: oklch(0.145 0 0);
            --card: oklch(1 0 0);
            --card-foreground: oklch(0.145 0 0);
            --popover: oklch(1 0 0);
            --popover-foreground: oklch(0.145 0 0);
            --primary: oklch(0.505 0.213 27.518);
            --primary-foreground: oklch(0.971 0.013 17.38);
            --secondary: oklch(0.967 0.001 286.375);
            --secondary-foreground: oklch(0.21 0.006 285.885);
            --muted: oklch(0.97 0 0);
            --muted-foreground: oklch(0.556 0 0);
            --accent: oklch(0.97 0 0);
            --accent-foreground: oklch(0.205 0 0);
            --destructive: oklch(0.577 0.245 27.325);
            --border: oklch(0.922 0 0);
            --input: oklch(0.922 0 0);
            --ring: oklch(0.708 0 0);
            --chart-1: oklch(0.808 0.114 19.571);
            --chart-2: oklch(0.637 0.237 25.331);
            --chart-3: oklch(0.577 0.245 27.325);
            --chart-4: oklch(0.505 0.213 27.518);
            --chart-5: oklch(0.444 0.177 26.899);
            --radius: 0.625rem;
            --sidebar: oklch(0.985 0 0);
            --sidebar-foreground: oklch(0.145 0 0);
            --sidebar-primary: oklch(0.577 0.245 27.325);
            --sidebar-primary-foreground: oklch(0.971 0.013 17.38);
            --sidebar-accent: oklch(0.97 0 0);
            --sidebar-accent-foreground: oklch(0.205 0 0);
            --sidebar-border: oklch(0.922 0 0);
            --sidebar-ring: oklch(0.708 0 0);
        }

        .dark {
            --background: #0a0a0a;
            --foreground: oklch(0.985 0 0);
            --card: oklch(0.205 0 0);
            --card-foreground: oklch(0.985 0 0);
            --popover: oklch(0.205 0 0);
            --popover-foreground: oklch(0.985 0 0);
            --primary: oklch(0.444 0.177 26.899);
            --primary-foreground: oklch(0.971 0.013 17.38);
            --secondary: oklch(0.274 0.006 286.033);
            --secondary-foreground: oklch(0.985 0 0);
            --muted: oklch(0.269 0 0);
            --muted-foreground: oklch(0.708 0 0);
            --accent: oklch(0.269 0 0);
            --accent-foreground: oklch(0.985 0 0);
            --destructive: oklch(0.704 0.191 22.216);
            --border: oklch(1 0 0 / 10%);
            --input: oklch(1 0 0 / 15%);
            --ring: oklch(0.556 0 0);
            --chart-1: oklch(0.808 0.114 19.571);
            --chart-2: oklch(0.637 0.237 25.331);
            --chart-3: oklch(0.577 0.245 27.325);
            --chart-4: oklch(0.505 0.213 27.518);
            --chart-5: oklch(0.444 0.177 26.899);
            --sidebar: oklch(0.205 0 0);
            --sidebar-foreground: oklch(0.985 0 0);
            --sidebar-primary: oklch(0.637 0.237 25.331);
            --sidebar-primary-foreground: oklch(0.971 0.013 17.38);
            --sidebar-accent: oklch(0.269 0 0);
            --sidebar-accent-foreground: oklch(0.985 0 0);
            --sidebar-border: oklch(1 0 0 / 10%);
            --sidebar-ring: oklch(0.556 0 0);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: var(--background);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
        }

        .page {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0;
            background:
                radial-gradient(1200px 600px at 50% -10%, color-mix(in oklch, var(--primary) 12%, transparent) 0%, transparent 60%),
                var(--background);
        }

        .page > * {
            position: relative;
            z-index: 1;
        }

        .app-shell {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: stretch;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--sidebar-border);
            background: color-mix(in oklch, var(--sidebar) 92%, transparent);
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
        }

        .sidebar-brand {
            padding: 20px 16px 14px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-title {
            display: block;
            font-size: .9375rem;
            font-weight: 600;
            letter-spacing: -.02em;
            color: var(--sidebar-foreground);
            line-height: 1.3;
        }

        .sidebar-sub {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: var(--muted-foreground);
        }

        .sidebar-nav {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 10px;
            overflow: auto;
        }

        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 38px;
            padding: 0 12px 0 14px;
            border: none;
            border-radius: calc(var(--radius) - 4px);
            background: transparent;
            color: var(--sidebar-foreground);
            font: inherit;
            font-size: .8125rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .nav-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 3px;
            height: 0;
            border-radius: 0 2px 2px 0;
            background: var(--sidebar-primary);
            transform: translateY(-50%);
            transition: height .15s;
        }

        .nav-item:hover {
            background: var(--sidebar-accent);
            color: var(--sidebar-accent-foreground);
        }

        .nav-item.is-active {
            background: color-mix(in oklch, var(--sidebar-primary) 12%, var(--sidebar-accent));
            color: var(--sidebar-accent-foreground);
        }

        .nav-item.is-active::before {
            height: 18px;
        }

        .nav-group-label {
            padding: 10px 14px 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .06em;
            color: var(--muted-foreground);
            user-select: none;
        }

        .readonly-hint {
            flex-shrink: 0;
            font-size: 12px;
            color: var(--muted-foreground);
            line-height: 1.5;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 4px);
            background: color-mix(in oklch, var(--muted) 40%, transparent);
        }

        .org-view-split {
            flex: 1;
            min-height: 0;
        }

        .org-view-split .org-tree-row {
            cursor: default;
        }

        .org-view-table-wrap {
            flex: 1;
            border: none;
            border-radius: 0;
            border-top: 1px solid var(--border);
        }

        .sidebar-foot {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            border-top: 1px solid var(--sidebar-border);
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 18px 22px 14px;
        }

        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .main-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -.025em;
            line-height: 1.2;
        }

        /* DeepSeek Harness 暗色：#0a0a0a + 钢蓝体积光 + 极淡网格（边缘淡出） */
        .dark .page {
            background-color: #0a0a0a;
            background-image: none;
            overflow: hidden;
        }
        .dark .page::before,
        .dark .page::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .dark .page::before {
            background:
                radial-gradient(ellipse 90% 70% at 58% 32%, rgba(118, 142, 186, 0.22) 0%, transparent 58%),
                radial-gradient(ellipse 55% 45% at 18% 78%, rgba(70, 90, 130, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse 50% 35% at 82% 88%, rgba(90, 110, 150, 0.08) 0%, transparent 50%);
        }
        .dark .page::after {
            background-image:
                linear-gradient(to right, rgba(186, 204, 230, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(186, 204, 230, 0.08) 1px, transparent 1px);
            background-size: 90px 90px;
            opacity: 0.32;
            -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 38%, #000 12%, transparent 72%);
            mask-image: radial-gradient(ellipse 80% 70% at 50% 38%, #000 12%, transparent 72%);
        }

        .page-title {
            font-size: 1.375rem;
            font-weight: 600;
            letter-spacing: -.025em;
            line-height: 1.2;
        }

        .tab-panels {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .tab-panel {
            flex: 1;
            min-height: 0;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .tab-panel.is-active {
            display: flex;
        }

        .data-table {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .data-table-mount {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .dt-toolbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        .dt-filter-input {
            width: 220px;
            max-width: 100%;
            flex: 0 0 auto;
            height: 32px;
            padding: 0 10px;
            border: 1px solid var(--input);
            border-radius: calc(var(--radius) - 4px);
            background: var(--background);
            color: var(--foreground);
            font: inherit;
            font-size: .8125rem;
        }

        .dt-filter-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--background), 0 0 0 4px color-mix(in oklch, var(--ring) 30%, transparent);
        }

        .dt-meta {
            font-size: 12px;
            color: var(--muted-foreground);
            white-space: nowrap;
        }

        .dt-table-wrap {
            flex: 1;
            min-height: 0;
        }

        .dt-pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .dt-page-info {
            font-size: 12px;
            color: var(--muted-foreground);
        }

        .dt-page-size {
            height: 28px;
            border: 1px solid var(--input);
            border-radius: calc(var(--radius) - 4px);
            background: var(--background);
            color: var(--foreground);
            font-size: 12px;
            padding: 0 6px;
        }

        .dt-empty {
            text-align: center;
            color: var(--muted-foreground);
            padding: 24px 12px !important;
        }

        .org-dialog-dt {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .table th.th-sort {
            cursor: pointer;
            user-select: none;
        }

        .table th.th-sort:hover {
            background: color-mix(in oklch, var(--accent) 65%, transparent);
        }

        .th-sort-inner {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .th-sort-icon {
            display: inline-flex;
            flex-direction: column;
            gap: 1px;
            opacity: .35;
            line-height: 0;
        }

        .th-sort.is-asc .th-sort-icon,
        .th-sort.is-desc .th-sort-icon {
            opacity: 1;
            color: var(--primary);
        }

        .th-sort.is-asc .sort-down,
        .th-sort.is-desc .sort-up,
        .th-sort:not(.is-asc):not(.is-desc) .sort-up,
        .th-sort:not(.is-asc):not(.is-desc) .sort-down {
            opacity: .2;
        }

        .th-sort.is-asc .sort-up {
            opacity: 1;
        }

        .th-sort.is-desc .sort-down {
            opacity: 1;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            column-gap: 12px;
            row-gap: 8px;
            flex-shrink: 0;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: calc(var(--radius) - 2px);
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--foreground);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s, border-color .15s;
        }

        .icon-btn:hover {
            background: var(--accent);
            color: var(--accent-foreground);
        }

        .icon-btn .icon-sun {
            display: none;
        }

        .dark .icon-btn .icon-sun {
            display: block;
        }

        .dark .icon-btn .icon-moon {
            display: none;
        }

        /* mira Badge — default */
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            border: 1px solid transparent;
            padding: 2px 9px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.35;
            width: fit-content;
            background: var(--primary);
            color: var(--primary-foreground);
        }

        /* mira Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            border-radius: calc(var(--radius) - 2px);
            font-size: .8125rem;
            font-weight: 500;
            height: 32px;
            padding: 0 14px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s, opacity .15s;
        }

        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--background), 0 0 0 4px color-mix(in oklch, var(--ring) 30%, transparent);
        }

        .btn:disabled {
            pointer-events: none;
            opacity: .5;
        }

        .btn-default {
            background: var(--primary);
            color: var(--primary-foreground);
        }

        .btn-default:hover {
            background: color-mix(in oklch, var(--primary) 80%, transparent);
        }

        .btn-outline {
            background: transparent;
            border-color: var(--border);
            color: var(--foreground);
        }

        .dark .btn-outline {
            background: color-mix(in oklch, var(--input) 30%, transparent);
        }

        .btn-outline:hover {
            background: color-mix(in oklch, var(--input) 50%, transparent);
        }

        /* shadcn Table（结构对齐 Table/TableHeader/TableRow/TableHead/TableBody/TableCell，
           样式用现有 CSS 变量主题，亮暗色自动跟随） */
        .table-wrap {
            flex: 1;
            min-height: 0;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 4px);
            overflow: auto;
            background: color-mix(in oklch, var(--background) 42%, transparent);
            backdrop-filter: blur(20px) saturate(1.15);
            -webkit-backdrop-filter: blur(20px) saturate(1.15);
        }

        .table {
            width: 100%;
            font-size: .8125rem;
            border-collapse: collapse;
            caption-side: bottom;
            background: transparent;
        }

        .table thead tr {
            border-bottom: 1px solid var(--border);
            background: transparent;
        }

        .table th {
            position: sticky;
            top: 0;
            z-index: 1;
            height: 2.25rem;
            padding: 0 .4375rem;
            text-align: left;
            vertical-align: middle;
            font-weight: 500;
            color: var(--foreground);
            background: color-mix(in oklch, var(--background) 48%, transparent);
            backdrop-filter: blur(20px) saturate(1.15);
            -webkit-backdrop-filter: blur(20px) saturate(1.15);
            white-space: nowrap;
        }

        .table tbody tr {
            border-bottom: 1px solid var(--border);
            background: transparent;
            transition: background .15s;
        }

        .table tbody tr:last-child {
            border-bottom: 0;
        }

        .table tbody tr:hover {
            background: color-mix(in oklch, var(--foreground) 6%, transparent);
        }

        .table td {
            padding: .375rem .4375rem;
            vertical-align: middle;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            background: transparent;
        }

        .table td.cfg {
            font: 12px/1.4 ui-monospace, Consolas, monospace;
            color: var(--muted-foreground);
        }

        .status-line {
            min-height: 1.3em;
            font-size: 12px;
            color: var(--muted-foreground);
            line-height: 1.5;
        }

        /* shadcn Dialog（结构对齐 Dialog/Overlay/Content/Header/Title/Description/Footer/Close，
           样式用现有 CSS 变量主题） */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
        }
        .dialog-overlay[hidden] {
            display: none;
        }
        .dialog-content {
            width: 100%;
            max-width: min(1360px, calc(100vw - 40px));
            height: min(680px, calc(100vh - 40px));
            display: flex;
            flex-direction: column;
            border-radius: var(--radius);
            background: var(--card);
            color: var(--card-foreground);
            box-shadow:
                0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent),
                0 20px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .dialog-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            padding: 16px 20px 12px;
            flex-shrink: 0;
        }
        .dialog-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -.01em;
            line-height: 1.3;
        }
        .dialog-close {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: var(--muted-foreground);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: calc(var(--radius) - 2px);
        }
        .dialog-close:hover {
            background: var(--accent);
            color: var(--accent-foreground);
        }
        .dialog-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 16px;
            padding: 0 20px 12px;
        }
        .dialog-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .dialog-field label,
        .dlg-col-label {
            font-size: 12px;
            color: var(--muted-foreground);
        }
        .dialog-field select,
        .dialog-field textarea {
            border: 1px solid var(--input);
            border-radius: calc(var(--radius) - 4px);
            background: var(--background);
            color: var(--foreground);
            padding: 0 8px;
            font-size: 13px;
            font-family: inherit;
        }
        .dialog-field select {
            height: 32px;
        }
        .dialog-field textarea {
            padding: 8px;
            line-height: 1.5;
            resize: vertical;
        }
        .dialog-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 20px 16px;
            flex-shrink: 0;
            border-top: 1px solid var(--border);
        }
        .chk {
            width: 14px;
            height: 14px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .dlg-org-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .dlg-form-col {
            flex: 0 0 380px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }
        .dlg-field-grow {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .cfg-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 4px);
            background: var(--background);
            padding: 10px;
            overflow: auto;
        }
        .cfg-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
        }
        .cfg-panel-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--foreground);
        }
        .cfg-panel-hint {
            font-size: 11px;
            color: var(--muted-foreground);
            line-height: 1.4;
        }
        .cfg-panel-hint.is-error {
            color: var(--destructive);
        }
        .cfg-panel-hint.is-ok {
            color: color-mix(in oklch, var(--primary) 70%, var(--foreground));
        }
        .cfg-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .cfg-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cfg-row input[type="text"],
        .cfg-row input[type="number"] {
            height: 30px;
            border: 1px solid var(--input);
            border-radius: calc(var(--radius) - 4px);
            background: var(--background);
            color: var(--foreground);
            padding: 0 8px;
            font-size: 12px;
            font-family: inherit;
        }
        .cfg-row input[type="text"] {

                clog("未找到元素 #" + id + "，跳过绑定");
                return;

            el.onclick = handler;

        // 官方脚本的 this 绑定在苍穹页面上下文，控件 DOM 在父页面（window.parent.document）。
        // 只查父页面；跨域时访问 parent 会抛异常，记日志后 getElement() 为 null。
        function waitEl(id, ms) {
            return new Promise(function (resolve) {
                setTimeout(function () {
                    var el = null;
                    try {
                        el = window.parent.document.getElementById(id);
                    } catch (e) {
                        clog("无法访问父页面 #" + id + ": " + (e && e.message));
                    }
                    resolve({ getElement: function () { return el; } });
                }, ms || 150);

        function findOrgMeta(id, node, parent) {
            node = node || ORG_TREE;
            parent = parent || null;
            if (node.id === id) return { node: node, parent: parent };
            var ch = node.children || [];
            for (var i = 0; i < ch.length; i++) {
                var hit = findOrgMeta(id, ch[i], node);
                if (hit) return hit;
            }
            return null;
        }

            });
        }
        function orgTableSource() {
            var meta = findOrgMeta(orgState.activeId);
            var node = meta ? meta.node : ORG_TREE;
            var rows = [];
            if (orgState.includeSelf && node.id !== "all") {
                var p = meta && meta.parent ? meta.parent : null;
                rows.push({
                    id: node.id,
                    name: node.name,
                    status: node.status || "已审核",
                    parentName: p && p.id !== "all" ? p.name : ""
                });
            }
            (node.children || []).forEach(function (c) {
                rows.push({
                    id: c.id,
                    name: c.name,
                    status: c.status || "已审核",
                    parentName: node.id === "all" ? "" : node.name
                });
            });

            var fields = [
                { key: "partyPerfLabel", label: "在" + period + "党群绩效评价为（文本）" },
                { key: "adminPerfLabel", label: "行政绩效为（文本）" },
                { key: "excellenceLabel", label: "创先争优评价为（文本）" }
            ];
            var hint = document.createElement("div");
            hint.className = "cfg-panel-hint";
            hint.textContent = "配置填报时各评价维度对应的提示文本";
            dlgConfigPanel.appendChild(hint);
            fields.forEach(function (f) {
                var wrap = document.createElement("div");
                wrap.className = "cfg-text-field";
                var label = document.createElement("label");
                label.textContent = f.label;
                var input = document.createElement("input");
                input.type = "text";
                input.value = data[f.key] || "";
                input.placeholder = "请输入提示文本";
                input.oninput = function () {
                    data[f.key] = input.value.trim();
                };
                wrap.appendChild(label);
                wrap.appendChild(input);
                dlgConfigPanel.appendChild(wrap);
            });
        }
        function renderGrassrootsPanel(data) {
            dlgConfigPanel.innerHTML = "";
            var head = document.createElement("div");
            head.className = "cfg-panel-head";
            var title = document.createElement("span");
            title.className = "cfg-panel-title";
            title.textContent = "项点名称与分数";
            var addBtn = document.createElement("button");
            addBtn.type = "button";
            addBtn.className = "btn btn-outline";
            addBtn.style.height = "28px";
            addBtn.style.padding = "0 10px";
            addBtn.style.fontSize = "12px";
            addBtn.textContent = "添加项点";
            head.appendChild(title);
            head.appendChild(addBtn);
            dlgConfigPanel.appendChild(head);
            var hint = document.createElement("div");
            hint.className = "cfg-panel-hint";
            hint.textContent = "可添加任意数量项点，每项包含名称与分数";
            dlgConfigPanel.appendChild(hint);
            var list = document.createElement("div");
            list.className = "cfg-list";
            dlgConfigPanel.appendChild(list);

            function paint() {
                list.innerHTML = "";
                data.items.forEach(function (item, idx) {
                    var row = document.createElement("div");
                    row.className = "cfg-row";
                    var no = document.createElement("span");
                    no.className = "cfg-row-label";
                    no.textContent = String(idx + 1);
                    var nameInput = document.createElement("input");
                    nameInput.type = "text";
                    nameInput.placeholder = "项点名称";
                    nameInput.value = item.name || "";
                    nameInput.oninput = function () {
                        item.name = nameInput.value.trim();
                    };
                    var scoreInput = document.createElement("input");
                    scoreInput.type = "number";
                    scoreInput.min = "0";
                    scoreInput.step = "0.5";
                    scoreInput.placeholder = "分数";
                    scoreInput.value = item.score != null ? item.score : "";
                    scoreInput.oninput = function () {
                        item.score = Number(scoreInput.value);
                    };
                    var delBtn = document.createElement("button");
                    delBtn.type = "button";
                    delBtn.className = "btn-icon danger";
                    delBtn.title = "删除";
                    delBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
                    delBtn.onclick = function () {
                        if (data.items.length <= 1) return;
                        data.items.splice(idx, 1);
                        paint();
                    };
                    row.appendChild(no);
                    row.appendChild(nameInput);
                    row.appendChild(scoreInput);
                    row.appendChild(delBtn);
                    list.appendChild(row);
                });
            }
            addBtn.onclick = function () {
                data.items.push({ name: "", score: 0 });
                paint();
            };
            paint();
        }
        function renderConfigPanel() {
            if (!dlgConfigPanel || !dlgType) return;
            var type = dlgType.value;
            configDraft = defaultConfigForType(type);
            if (isPartyPerfType(type)) renderPartyPerfPanel(configDraft);
            else if (isExcellenceType(type)) renderExcellencePanel(configDraft, type);
            else if (isGrassrootsType(type)) renderGrassrootsPanel(configDraft);
            else dlgConfigPanel.innerHTML = "";
        }
        function validateConfig(type, data) {
            if (isPartyPerfType(type)) {
                if (!data.items || !data.items.length) return "请至少配置一个项点";
                for (var i = 0; i < data.items.length; i++) {
                    if (!data.items[i].label) return "第 " + (i + 1) + " 项点文本不能为空";
                    if (data.items[i].percent == null || isNaN(data.items[i].percent) || data.items[i].percent < 0) {
                        return "第 " + (i + 1) + " 项占比无效";
                    }
                }
                if (sumPercents(data.items) !== 100) return "项点占比之和须为 100%，当前为 " + sumPercents(data.items) + "%";
                return "";
            }
            if (isExcellenceType(type)) {
                if (!data.partyPerfLabel) return "请填写党群绩效评价提示文本";
                if (!data.adminPerfLabel) return "请填写行政绩效提示文本";
                if (!data.excellenceLabel) return "请填写创先争优评价提示文本";
                return "";
            }
            if (isGrassrootsType(type)) {
                if (!data.items || !data.items.length) return "请至少配置一个项点";
                for (var j = 0; j < data.items.length; j++) {
                    if (!data.items[j].name) return "第 " + (j + 1) + " 项点名称不能为空";
                    if (data.items[j].score == null || isNaN(data.items[j].score) || data.items[j].score < 0) {
                        return "第 " + (j + 1) + " 项分数无效";
                    }
                }
                return "";
            }
            return "未知配置类型";
        }
        function buildConfigJson(type, data) {
            return JSON.stringify({ type: type, typeName: CONFIG_TYPES[type] || type, config: data });
        }

        function openDialog() {
            if (!dlg) { clog("弹窗元素不存在 #dlg-overlay"); return; }
            if (dlgType) dlgType.selectedIndex = 0;
            renderConfigPanel();
            resetOrgPicker();
            dlg.hidden = false;
            if (dlgType) dlgType.focus();
        }
        function closeDialog() {
            if (dlg) dlg.hidden = true;
        }
        if (dlgType) dlgType.onchange = renderConfigPanel;
        bind("tblnew", async () => {
            var selfBtn = document.getElementById("tblnew");
            var got = await waitEl("tblnew");
            var addBtn = got.getElement();
            if (!addBtn) {
                setStatus("未找到父页面 #tblnew，父页面新增逻辑未执行");
                clog("wait('tblnew') 在父页面未找到元素");
                return;
            }
            // 本地单独打开 index.html 时 parent === 当前页，#tblnew 就是自己，不能再 click 以免递归
            if (addBtn !== selfBtn) {
                addBtn.click();
                clog("已 click 父页面 #tblnew", addBtn.tagName);
            } else {
                clog("父页面 #tblnew 与当前按钮为同一元素（本地预览），跳过 click");
            }
            openDialog();
            setStatus("已触发父页面新增，请填写配置项");
        });
        bind("dlg-close", closeDialog);
        bind("dlg-cancel", closeDialog);
        // 点遮罩关闭（与 shadcn Dialog 行为一致）
        if (dlg) {
            dlg.addEventListener("click", function (e) {
                if (e.target === dlg) closeDialog();
            });
        }
        bind("dlg-ok", () => {
            var names = selectedOrgNames();
            if (!names.length) {
                setStatus("请选择党组织");
                return;
            }
            var type = dlgType ? dlgType.value : "";
            var typeName = CONFIG_TYPES[type] || type;
            var err = validateConfig(type, configDraft || {});
            if (err) {
                setStatus(err);
                return;
            }
            var cfg = buildConfigJson(type, configDraft);
            var org = names.join("、");
            var no = randNo("CQ");
            TABLE_DEFS.config.rows.unshift({
                no: no,
                statusText: "暂存",
                statusCode: "A",
                org: org,
                typeName: typeName,
                config: cfg
            });
            refreshDataTable("config");
            switchTab("config");
            closeDialog();
            setStatus("已新增「" + org + " / " + typeName + "」 " + no);
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                if (dlg && !dlg.hidden) { closeDialog(); return; } // 弹窗优先关闭
                unmount();
            }
        });
        try {
            syncThemeButton();
            initTableData();
            initTabs();
        } catch (err) {
            clog("初始化失败: " + (err && err.message));
        }
    </script>
</body>

</html>
